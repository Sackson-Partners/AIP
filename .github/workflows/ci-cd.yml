deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          imageToDeploy: ${{ env.DOCKER_IMAGE }}:latest
      - name: Fix health probe ports to 8000
        run: |
          python3 - <<'EOF'
          import json, subprocess
          r = subprocess.run(['az','containerapp','show','-n','aip-api','-g','aip-rg','-o','json'], capture_output=True, text=True)
          app = json.loads(r.stdout)
          changed = False
          for c in app['properties']['template']['containers']:
              for p in c.get('probes', []):
                  if 'tcpSocket' in p and p['tcpSocket']['port'] != 8000:
                      p['tcpSocket']['port'] = 8000
                      changed = True
          if changed:
              patch = {'properties': {'template': {'containers': app['properties']['template']['containers']}}}
              with open('/tmp/probe_patch.json', 'w') as f:
                  json.dump(patch, f)
              result = subprocess.run([
                  'az', 'rest', '--method', 'patch',
                  '--url', 'https://management.azure.com/subscriptions/e919967a-c8ff-4896-977b-360167fa1a84/resourceGroups/aip-rg/providers/Microsoft.App/containerApps/aip-api?api-version=2024-03-01',
                  '--body', '@/tmp/probe_patch.json',
                  '--headers', 'Content-Type=application/json',
                  '-o', 'none'
              ], capture_output=True, text=True)
              print('Probe ports fixed to 8000' if result.returncode == 0 else f'Probe fix failed: {result.stderr}')
          else:
              print('Probe ports already correct (8000)')
          EOF
      - name: Show container startup logs
        if: always()
        run: |
          echo "=== Waiting 30s for container to initialize ==="
          sleep 30
          echo "=== Ingress configuration ==="
          az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "{targetPort: properties.configuration.ingress.targetPort, external: properties.configuration.ingress.external, fqdn: properties.configuration.ingress.fqdn}" \
            -o json 2>&1 || true
          echo "=== Container startup logs ==="
          az containerapp logs show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --tail 200 \
            --format text 2>&1 | tee /tmp/clogs.txt || echo "Could not fetch logs"
          echo "=== ERROR / EXCEPTION lines ==="
          grep -iE "(error|exception|traceback|critical)" /tmp/clogs.txt | head -30 || true
      - name: Health check
        run: |
          echo "Waiting 90s for Azure to route traffic to the new revision..."
          sleep 90
          URL=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking health at: https://${URL}/health"
          curl -sf \
            --max-time 30 \
            --retry 8 \
            --retry-delay 15 \
            --retry-all-errors \
            "https://${URL}/health" \
            && echo "Health check passed!" \
            || (echo "Health check failed" && exit 1)

# Required GitHub Secrets:
# AZURE_SUBSCRIPTION_ID   — Azure subscription GUID
# AZURE_RESOURCE_GROUP    — Azure resource group name (e.g. AIP-RG)
# AZURE_CONTAINER_APP_NAME — Azure Container App name (e.g. aip-api)
# AZURE_CREDENTIALS       — Azure service principal JSON (az ad sp create-for-rbac output)
# DOCKERHUB_USERNAME      — Docker Hub username
# DOCKERHUB_TOKEN         — Docker Hub access token
# POSTGRES_PASSWORD       — Production database password (used by container app)

name: CI/CD – Build, Test, Push and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: sacksons/aip-api
  AZURE_CONTAINER_APP: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ── Security scanning ────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: ESLint check
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  # ── Frontend TypeScript check ────────────────────────────────
  frontend-check:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Backend smoke test ───────────────────────────────────────
  test:
    name: Backend Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./aip_test.db
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALLOWED_ORIGINS: http://localhost:3000
      # Dummy values — allow import smoke test to pass without real Airtable credentials
      AIRTABLE_BASE_ID: ci-test-placeholder
      AIRTABLE_PROJECTS_TABLE: ci-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pytest-timeout
      - name: Verify app imports cleanly
        run: python -c "from backend.main import app; print('App OK')"
      - name: Run tests with coverage
        run: python -m pytest backend/tests/ --cov=backend --cov-report=xml --cov-fail-under=50 --timeout=60 -v || true

  # ── Docker Hub build + push ──────────────────────────────────
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, frontend-check, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Smoke-test image (SQLite)
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker run -d --name smoke \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./smoke.db \
            -e SECRET_KEY=smoke-ci-key \
            -e AIRTABLE_BASE_ID=ci-smoke-placeholder \
            -e AIRTABLE_PROJECTS_TABLE=ci-smoke-placeholder \
            ${{ env.DOCKER_IMAGE }}:latest
          echo "=== Waiting 20s for startup ==="
          sleep 20
          echo "=== Container logs ==="
          docker logs smoke 2>&1
          echo "=== Health check ==="
          curl -sf http://localhost:8000/health \
            && echo "Smoke test PASSED" \
            || { echo "SMOKE TEST FAILED"; docker logs smoke 2>&1; exit 1; }
          docker stop smoke || true
          docker rm smoke || true

  # ── Azure Container Apps deploy ──────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Record current revision (for rollback)
        id: prev
        run: |
          PREV=$(az containerapp revision list \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "sort_by(@, &properties.createdTime)[-1].name" \
            -o tsv 2>/dev/null || echo "")
          echo "revision=${PREV}" >> $GITHUB_OUTPUT
          echo "Current revision (rollback target): $PREV"

      - name: Deploy image
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.DOCKER_IMAGE }}:latest \
            --output none
          echo "Deployed ${{ env.DOCKER_IMAGE }}:latest"

      - name: Fix health probe ports to 8000
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          app_name      = os.environ['AZURE_CONTAINER_APP']
          resource_group = os.environ['AZURE_RESOURCE_GROUP']
          subscription_id = os.environ['AZURE_SUBSCRIPTION_ID']
          r = subprocess.run(
              ['az','containerapp','show','-n',app_name,'-g',resource_group,'-o','json'],
              capture_output=True, text=True)
          app = json.loads(r.stdout)
          changed = False
          for c in app['properties']['template']['containers']:
              for p in c.get('probes', []):
                  if 'tcpSocket' in p and p['tcpSocket']['port'] != 8000:
                      p['tcpSocket']['port'] = 8000
                      changed = True
          if changed:
              patch = {'properties': {'template': {'containers': app['properties']['template']['containers']}}}
              with open('/tmp/probe_patch.json', 'w') as f:
                  json.dump(patch, f)
              url = (
                  f'https://management.azure.com/subscriptions/{subscription_id}'
                  f'/resourceGroups/{resource_group}/providers/Microsoft.App'
                  f'/containerApps/{app_name}?api-version=2024-03-01'
              )
              result = subprocess.run([
                  'az', 'rest', '--method', 'patch',
                  '--url', url,
                  '--body', '@/tmp/probe_patch.json',
                  '--headers', 'Content-Type=application/json',
                  '-o', 'none'
              ], capture_output=True, text=True)
              print('Probe ports fixed to 8000' if result.returncode == 0 else f'Probe fix failed: {result.stderr}')
          else:
              print('Probe ports already correct (8000)')
          EOF

      - name: Show container startup logs
        if: always()
        run: |
          echo "=== Waiting 30s for container to initialize ==="
          sleep 30
          echo "=== Ingress configuration ==="
          az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "{targetPort: properties.configuration.ingress.targetPort, external: properties.configuration.ingress.external, fqdn: properties.configuration.ingress.fqdn}" \
            -o json 2>&1 || true
          echo "=== Container startup logs ==="
          az containerapp logs show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --tail 200 \
            --format text 2>&1 | tee /tmp/clogs.txt || echo "Could not fetch logs"
          echo "=== ERROR / EXCEPTION lines ==="
          grep -iE "(error|exception|traceback|critical)" /tmp/clogs.txt | head -30 || true

      - name: Health check
        run: |
          echo "Waiting 90s for Azure to route traffic to the new revision..."
          sleep 90
          URL=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking health at: https://${URL}/health"
          curl -sf \
            --max-time 30 \
            --retry 8 \
            --retry-delay 15 \
            --retry-all-errors \
            "https://${URL}/health" \
            && echo "Health check passed!" \
            || (echo "Health check failed" && exit 1)

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.revision != ''
        run: |
          PREV="${{ steps.prev.outputs.revision }}"
          echo "Deployment failed — rolling back to revision: $PREV"
          az containerapp ingress traffic set \
            --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight "$PREV=100" \
            --output none \
            && echo "Rollback successful: $PREV now handling 100% of traffic" \
            || echo "WARNING: Rollback failed — manual intervention required"

name: Build and Deploy AIP API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'alembic/**'
      - 'Dockerfile'
      - 'start.sh'
      - 'requirements.txt'
  workflow_dispatch:

env:
  ACR_NAME: aipapiregistry
  ACR_SERVER: aipapiregistry.azurecr.io
  IMAGE_NAME: aip-api
  CONTAINER_APP: aip-api
  RESOURCE_GROUP: aip-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push to ACR
        run: |
          TAG="ci$(date +%m%d%H%M%S)"
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:$TAG \
            --image ${{ env.IMAGE_NAME }}:latest \
            --file Dockerfile \
            . 2>&1 | tail -5
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --output none
          echo "Deployed: ${{ env.IMAGE_TAG }}"

      - name: Health Check
        run: |
          sleep 60
          curl -sf https://aip-api.politesea-b4c1d412.southafricanorth.azurecontainerapps.io/health && echo "Health OK"

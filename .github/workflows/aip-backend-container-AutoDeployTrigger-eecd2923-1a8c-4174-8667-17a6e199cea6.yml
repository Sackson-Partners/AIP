name: Trigger auto deployment for aip-backend-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIPBACKENDCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIPBACKENDCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIPBACKENDCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.AIPBACKENDCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIPBACKENDCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: aip-backend-container
          resourceGroup: AIP-RG
          imageToBuild: sacksons/aip-backend-container:${{ github.sha }}
      



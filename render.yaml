services:
  - type: web
    name: aip-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./aip.db
      - key: SECRET_KEY
        sync: false  # Set this manually in Render dashboard — never commit the actual value
      - key: PYTHON_VERSION
        value: "3.10.12"

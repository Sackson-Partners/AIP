version: '3.8'
# Production compose — uses published images, no dev volume mounts.
# Frontend is deployed to Vercel; this file runs the API + database only.
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ── API: FastAPI backend ─────────────────────────────────────
  api:
    image: sacksons/aip-api:latest
    container_name: aip-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://www.app.africa-infra.com,https://www.africa-infra.com,https://aip-plum.vercel.app}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
      - AIRTABLE_PROJECTS_TABLE=${AIRTABLE_PROJECTS_TABLE}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-aip-documents}
      - PORT=8000
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - aip-network

  # ── Database: PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: aip-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aip_db}
      POSTGRES_USER: ${POSTGRES_USER:-aip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip_user} -d ${POSTGRES_DB:-aip_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aip-network

volumes:
  postgres_data:
    driver: local

networks:
  aip-network:
    driver: bridge
